<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/theme.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/screens/game.css" />
<style>
  html,body{margin:0;height:100%;background:linear-gradient(160deg,#0f1a17,#080d0b);font-family:"Noto Sans SC",sans-serif;
    display:flex;align-items:center;justify-content:center;color:#eef6f2}
  .host{position:relative;padding:20px 20px 60px;width:460px}
  .gtrait{display:flex;justify-content:flex-end}
  .gtrait__pop{right:0 !important;top:44px !important;position:absolute}
  body{align-items:flex-start;padding-top:40px}
</style></head>
<body>
<div class="host">
  <div class="gtrait">
    <button type="button" class="gtrait__btn is-open">
      <span class="gtrait__ico">◆</span>词条<b class="num">3</b>
    </button>
    <div class="gtrait__pop" style="top:44px">
      <div class="gtrait__head">
        <div class="gtrait__title">
          <span class="gtrait__micro">INFINITE PROTOCOL · TRAIT</span>
          <b>本局生效词条</b>
        </div>
        <button type="button" class="gtrait__x">×</button>
      </div>
      <div class="gtrait__tally">
        <span class="gtrait__tal is-pos"><b class="num">2</b><i>正面</i></span>
        <span class="gtrait__tal is-neg"><b class="num">1</b><i>负面</i></span>
        <span class="gtrait__tal is-total"><b class="num">3</b><i>合计</i></span>
      </div>
      <p class="gtrait__note">词条从选定回合起生效，贯穿本局剩余的全部战斗。</p>
      <ul class="gtrait__list">
        <li class="gtrait__row"><span class="gtrait__r num">R20</span><span class="gtrait__n">强攻</span><span class="gtrait__t">全体干员攻击力 +25%</span></li>
        <li class="gtrait__row"><span class="gtrait__r num">R25</span><span class="gtrait__n">灵巧</span><span class="gtrait__t">所有我方单位获得 15% 物理与法术闪避</span></li>
        <li class="gtrait__row is-neg"><span class="gtrait__r num">R30</span><span class="gtrait__n">虚弱</span><span class="gtrait__t">全体干员攻击力 -20%</span></li>
      </ul>
      <div class="gtrait__foot"><span class="gtrait__seal">全部生效中</span></div>
    </div>
  </div>
</div>
</body></html>
