<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  body{background:#07090a;color:#e8eceb;font-family:system-ui;padding:40px;margin:0}
  h2{font-size:13px;letter-spacing:.2em;color:#7d8a86;font-weight:400;margin:0 0 10px}
  .box{margin-bottom:34px}
  .sarkaz{font-family:'Endfield';font-size:44px;line-height:1.3;color:#e8b445;letter-spacing:.08em}
  .plain{font-family:Bender,monospace;font-size:15px;color:#7d8a86;letter-spacing:.3em;margin-top:8px}
  .row{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
</style></head><body>
  <div class="box">
    <h2>账号密文 whhzkypkn</h2>
    <div class="sarkaz">whhzkypkn</div>
    <div class="plain">whhzkypkn</div>
  </div>
  <div class="box">
    <h2>对照：abcdefghijklmnopqrstuvwxyz</h2>
    <div class="sarkaz">abcdefghijklmnopqrstuvwxyz</div>
    <div class="plain">abcdefghijklmnopqrstuvwxyz</div>
  </div>
  <div class="box">
    <h2>数字 0123456789</h2>
    <div class="sarkaz">0123456789</div>
  </div>
</body></html>
