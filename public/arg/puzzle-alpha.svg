<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#e8b445" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#e8b445" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="400" height="260" fill="#050807"/>
  <!-- 细网格 -->
  <g stroke="#1a2420" stroke-width=".6">
    <line x1="0" y1="0" x2="400" y2="0"/><line x1="0" y1="32" x2="400" y2="32"/><line x1="0" y1="64" x2="400" y2="64"/><line x1="0" y1="96" x2="400" y2="96"/><line x1="0" y1="128" x2="400" y2="128"/><line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="192" x2="400" y2="192"/><line x1="0" y1="224" x2="400" y2="224"/><line x1="0" y1="256" x2="400" y2="256"/>
    <line x1="0" y1="0" x2="0" y2="260"/><line x1="33" y1="0" x2="33" y2="260"/><line x1="66" y1="0" x2="66" y2="260"/><line x1="99" y1="0" x2="99" y2="260"/><line x1="132" y1="0" x2="132" y2="260"/><line x1="165" y1="0" x2="165" y2="260"/><line x1="198" y1="0" x2="198" y2="260"/><line x1="231" y1="0" x2="231" y2="260"/><line x1="264" y1="0" x2="264" y2="260"/><line x1="297" y1="0" x2="297" y2="260"/><line x1="330" y1="0" x2="330" y2="260"/><line x1="363" y1="0" x2="363" y2="260"/><line x1="396" y1="0" x2="396" y2="260"/>
  </g>
  <!-- 背景碎星 -->
  <g fill="#5b6a64">
    <circle cx="42" cy="48" r="1"/><circle cx="96" cy="196" r=".8"/><circle cx="150" cy="60" r="1.1"/>
    <circle cx="214" cy="212" r=".9"/><circle cx="330" cy="72" r="1"/><circle cx="360" cy="188" r=".8"/>
    <circle cx="74" cy="128" r=".7"/><circle cx="286" cy="126" r=".9"/><circle cx="182" cy="150" r=".7"/>
    <circle cx="248" cy="44" r=".8"/><circle cx="118" cy="232" r=".7"/><circle cx="372" cy="120" r=".7"/>
  </g>
  <!-- 主星：三颗聚在一起 -->
  <circle cx="200" cy="120" r="26" fill="url(#g)" filter="url(#blur)"/>
  <circle cx="200" cy="120" r="6" fill="#fffdf5"/>
  <circle cx="186" cy="110" r="3.2" fill="#f4e6c0" opacity=".9"/>
  <circle cx="214" cy="132" r="2.6" fill="#f4e6c0" opacity=".8"/>
  <!-- 指向主星的短线 -->
  <line x1="238" y1="98" x2="212" y2="114" stroke="#e8b445" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
  <text x="246" y="94" fill="#e8b445" font-family="Bender,monospace" font-size="11" letter-spacing="1">?</text>
  <!-- 半人马座标注（极淡） -->
  <text x="20" y="242" fill="#3d4a44" font-family="Bender,monospace" font-size="9" letter-spacing="3">CENTAURUS · 半人马座</text>
</svg>