plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 这里**故意没有 signingConfig**：release 签名统一由 scripts/build-android.mjs 在 Gradle 之后用
// build-tools 的 zipalign + apksigner 完成（v1 + v2 + v3 三种方案全开）。交给 Gradle 签的话 AGP 会
// 按 minSdk 自己决定方案（minSdk 24 时它不签 v1），产出的包在个别老设备上装不上。密钥库路径与口令
// 仍从 android/local.properties 读，只是改由 build-android.mjs 读，不经过 Gradle。

android {
    namespace 'com.paper.stronghold'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.paper.stronghold"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "0.2.3-fusion"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 不设 signingConfig：AGP 产出 app-release-unsigned.apk，签名见本文件顶部注释。
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // AGP 8 does not generate BuildConfig unless asked; the bridge reports VERSION_NAME through it.
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    aaptOptions {
        noCompress 'zip', 'mp3', 'png', 'skel', 'atlas'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
