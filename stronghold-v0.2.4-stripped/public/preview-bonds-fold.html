<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>盟约向上小图标收起交互参照 (Bond Strip Fold Prototype)</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/screens/game.css">
  <style>
    :root {
      font-size: 50px; /* 模拟游戏主尺寸基准 */
    }
    body {
      margin: 0;
      padding: 0;
      background: #0d1210;
      color: #eef3f1;
      font-family: Bender, "Noto Sans SC", sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 顶部参照控制板 */
    .proto-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 22, 20, 0.95);
      border: 1px solid rgba(23, 249, 183, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 8px;
      padding: 12px 24px;
      display: flex;
      gap: 16px;
      align-items: center;
      z-index: 9999;
      font-size: 14px;
      backdrop-filter: blur(8px);
    }
    .proto-btn {
      background: #17f9b7;
      color: #0b0f0d;
      border: none;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .proto-btn:hover {
      background: #fff;
      box-shadow: 0 0 10px rgba(23, 249, 183, 0.5);
    }
    .proto-tag {
      color: #9ab3a8;
      font-size: 12px;
    }

    /* 模拟游戏画面容器 */
    .game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1a2723 0%, #0a0e0c 70%);
      overflow: hidden;
    }

    /* 模拟棋盘背景与网格 */
    .board-mock {
      position: absolute;
      top: 15%;
      left: 5%;
      right: 5%;
      bottom: 10%;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 24px),
                  radial-gradient(circle at center, rgba(30, 48, 42, 0.4) 0%, transparent 60%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.15);
      font-size: 24px;
      letter-spacing: 4px;
    }

    /* 模拟顶栏 HUD */
    .mock-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0.88rem;
      background: linear-gradient(180deg, rgba(12, 16, 14, 0.96) 0%, rgba(12, 16, 14, 0.85) 80%, transparent 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.4rem;
      z-index: 100;
    }
    .mock-hud-badge {
      display: flex;
      align-items: center;
      gap: 0.1rem;
      background: rgba(24, 32, 29, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 0.06rem 0.2rem;
      font-size: 0.28rem;
      font-weight: 700;
    }
    .mock-hud-badge.gold {
      color: #f6a329;
      border-color: rgba(246, 163, 41, 0.4);
    }
    .mock-hud-badge.green {
      color: #17f9b7;
      border-color: rgba(23, 249, 183, 0.4);
    }

    /* =========================================================================
       核心：全新“悬挂式微型折叠按钮”实现方案（像素级还原用户截图）
       ========================================================================= */

    /* 盟约整体外层容器（居中对齐） */
    .bonds-container {
      position: absolute;
      top: 0.92rem; /* 紧贴 TopBar 下方 */
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 110;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* 盟约徽章内容包装区（抽屉滑动） */
    .bonds-tray {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0.16rem;
      pointer-events: none;
      max-height: 2.2rem;
      opacity: 1;
      transform: translateY(0);
      transform-origin: top center;
      transition: max-height 0.24s cubic-bezier(0.2, 0.9, 0.3, 1),
                  opacity 0.2s cubic-bezier(0.2, 0.9, 0.3, 1),
                  transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .bonds-tray .bslot {
      pointer-events: auto;
      cursor: pointer;
    }

    /* 折叠状态（收起时） */
    .bonds-container.is-collapsed .bonds-tray {
      max-height: 0;
      opacity: 0;
      transform: translateY(-0.35rem) scale(0.96);
      pointer-events: none;
      overflow: hidden;
    }

    /* 红圈中还原的核心按钮：紧贴在徽章正下方的半透明微型折叠把手 */
    .bonds-fold-handle {
      pointer-events: auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.54rem;      /* 约 27px */
      height: 0.28rem;     /* 约 14px */
      margin-top: 0.04rem;
      background: rgba(18, 25, 23, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.65);
      transition: all 0.18s ease-out;
      outline: none;
      padding: 0;
    }

    .bonds-fold-handle:hover {
      background: rgba(28, 38, 35, 0.96);
      border-color: rgba(23, 249, 183, 0.6);
      color: #17f9b7;
      box-shadow: 0 0 8px rgba(23, 249, 183, 0.35);
    }

    .bonds-fold-handle:active {
      transform: scale(0.92);
      background: rgba(23, 249, 183, 0.2);
    }

    /* 内部微型箭头（双层箭头效果，完美契合截图中向上 ︽ 的视觉） */
    .fold-icon {
      width: 0.24rem;
      height: 0.24rem;
      display: grid;
      place-items: center;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .fold-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    /* 收起状态下，把手按钮动画翻转为向下 ︾ */
    .bonds-container.is-collapsed .bonds-fold-handle {
      margin-top: 0;
      background: rgba(14, 20, 18, 0.92);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .bonds-container.is-collapsed .fold-icon {
      transform: rotate(180deg);
    }

    /* 模拟截图里的“助力 0”单个徽章样式 */
    .mock-disc {
      position: relative;
      width: 0.76rem;
      height: 0.76rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 26, 23, 0.9) 0%, rgba(8, 12, 10, 0.95) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      display: grid;
      place-items: center;
    }
    /* 模拟外围能量环 */
    .mock-disc::before {
      content: "";
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #17f9b7;
      border-right-color: #17f9b7;
      transform: rotate(-35deg);
    }
    .mock-disc-icon {
      width: 0.44rem;
      height: 0.44rem;
      opacity: 0.85;
    }
    .mock-disc-label {
      font-size: 0.17rem;
      color: #eef3f1;
      margin-top: 0.05rem;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 3px #000;
      font-weight: 500;
    }
    .mock-disc-count {
      position: absolute;
      top: -0.06rem;
      right: -0.08rem;
      background: #0d1210;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.18rem;
      font-weight: 700;
      padding: 0 0.06rem;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 模拟游戏主界面 -->
  <div class="game-viewport">

    <!-- 顶部 HUD (TopBar) -->
    <header class="mock-topbar">
      <div style="display:flex; align-items:center; gap:0.2rem;">
        <span style="font-size:0.18rem; color:#8fa29a; letter-spacing:0.1em;">RHODES ISLAND TERMINAL</span>
        <div class="mock-hud-badge">回合 <span style="background:#fff; color:#000; padding:0 4px; margin-left:4px;">1</span></div>
      </div>

      <div class="mock-hud-badge gold">
        <span>⚔️</span>
        <span style="font-size:0.34rem; color:#ff4e20;">0</span>/4
      </div>

      <div style="display:flex; align-items:center; gap:0.2rem;">
        <div class="mock-hud-badge green">
          <span>🛡️</span> 24
        </div>
      </div>
    </header>

    <!-- 核心：盟约栏及其底部折叠把手 (像素级还原) -->
    <div id="bondsContainer" class="bonds-container">
      
      <!-- 盟约徽章托盘（展开/收起目标） -->
      <div class="bonds-tray">
        
        <!-- 模拟徽章 1：助力 0 (同用户截图) -->
        <div class="bslot" title="点击查看详情">
          <div class="mock-disc">
            <svg class="mock-disc-icon" viewBox="0 0 24 24" fill="none" stroke="#90a89f" stroke-width="2">
              <polygon points="12 2 15 8 22 9 17 14 18 21 12 17 6 21 7 14 2 9 9 8 12 2"/>
            </svg>
            <span class="mock-disc-count">0</span>
          </div>
          <span class="mock-disc-label">助力</span>
        </div>

        <!-- 模拟徽章 2：近卫 2 -->
        <div class="bslot" title="点击查看详情">
          <div class="mock-disc">
            <svg class="mock-disc-icon" viewBox="0 0 24 24" fill="none" stroke="#17f9b7" stroke-width="2">
              <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
              <path d="m13 19 6-6"/>
            </svg>
            <span class="mock-disc-count" style="color:#17f9b7; border-color:#17f9b7;">2</span>
          </div>
          <span class="mock-disc-label">近卫</span>
        </div>

        <!-- 模拟徽章 3：特种 1 -->
        <div class="bslot" title="点击查看详情">
          <div class="mock-disc">
            <svg class="mock-disc-icon" viewBox="0 0 24 24" fill="none" stroke="#90a89f" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="22" y1="12" x2="18" y2="12"/>
            </svg>
            <span class="mock-disc-count">1</span>
          </div>
          <span class="mock-disc-label">特种</span>
        </div>

      </div>

      <!-- 核心参照：红圈小按钮 (向上箭头收起 / 向下箭头展开) -->
      <button id="foldBtn" class="bonds-fold-handle" type="button" aria-label="收起盟约" title="收起/展开盟约">
        <span class="fold-icon">
          <!-- 双微型向上箭头 (Chevron Up) -->
          <svg viewBox="0 0 16 16">
            <path d="M8 3.5l-4.5 4.5 1 1L8 5.5l3.5 3.5 1-1L8 3.5zm0 4.5l-4.5 4.5 1 1L8 10l3.5 3.5 1-1L8 8z"/>
          </svg>
        </span>
      </button>

    </div>

    <!-- 模拟战场棋盘 -->
    <div class="board-mock">
      [ 战场 WebGL2 视口区域 · 第 12 行地块 ]
      <div style="font-size:14px; color:#5c7068; margin-top:8px;">
        (注意：收起时该按键不会遮挡任何触控，徽章向上抽回，棋盘顶部视野完全释放)
      </div>
    </div>

  </div>

  <!-- 底部交互控制条 -->
  <div class="proto-controls">
    <button class="proto-btn" id="toggleActionBtn">点击切换收起/展开</button>
    <span class="proto-tag">当前状态: <b id="stateText" style="color:#17f9b7;">已展开 (Expanded)</b></span>
    <span style="color:#4a6157;">|</span>
    <span class="proto-tag">悬挂把手尺寸: 27×14px (居中微型设计)</span>
  </div>

  <script>
    const container = document.getElementById('bondsContainer');
    const foldBtn = document.getElementById('foldBtn');
    const actionBtn = document.getElementById('toggleActionBtn');
    const stateText = document.getElementById('stateText');

    function toggleFold() {
      const isCollapsed = container.classList.toggle('is-collapsed');
      if (isCollapsed) {
        stateText.textContent = '已收起 (Folded)';
        stateText.style.color = '#f6a329';
        foldBtn.setAttribute('aria-label', '展开盟约');
        foldBtn.title = '展开盟约';
      } else {
        stateText.textContent = '已展开 (Expanded)';
        stateText.style.color = '#17f9b7';
        foldBtn.setAttribute('aria-label', '收起盟约');
        foldBtn.title = '收起盟约';
      }
    }

    foldBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFold();
    });

    if (window.location.search.includes('collapsed=1')) {
      toggleFold();
    }
  </script>
</body>
</html>
