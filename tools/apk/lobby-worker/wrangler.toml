# sp-lobby-board — the online-lobby room board ("房间牌") + the cross-server match queue: one Worker
# + TWO singleton Durable Objects (Board / MatchQueue, separate storage). State lives in Durable
# Object storage — never in Workers KV — and is reached through `idFromName('board')` /
# `idFromName('match')` in src/index.js. No outbound network I/O anywhere.

name = "sp-lobby-board"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Keep the workers.dev URL alive as a fallback: devices whose hot-updated content still points at it
# must keep working until they pick up the custom-domain build. The custom domain below is the
# primary route (reachable from mainland China).
workers_dev = true

[durable_objects]
bindings = [
  { name = "BOARD", class_name = "Board" },
  { name = "MATCH", class_name = "MatchQueue" },
]

# First migration for class "Board". SQLite-backed DO storage is the current default and works on the
# free plan; if your wrangler/account cannot use it yet, switch `new_sqlite_classes` to `new_classes`
# (KV-backed Durable Objects — paid plan; the src/index.js code is identical either way).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# v2 (2026-10-05): the cross-server match queue in its own singleton DO (idFromName('match')).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchQueue"]

# Custom domain (optional): if you have your domain on Cloudflare, uncomment to bind:
# [[routes]]
# pattern = "lobby.yourdomain.com"
# custom_domain = true

# ---------------------------------------------------------------------------------------------------
# DEPLOY (run from tools/apk/lobby-worker/)
#   export CLOUDFLARE_API_TOKEN=...      # credentials come from the environment ONLY — never commit
#   export CLOUDFLARE_ACCOUNT_ID=...     # (and set CLOUDFLARE_API_TOKEN via `npx wrangler login` fallback)
#   npx wrangler deploy
#
# The first deploy lands on the workers.dev route:  https://sp-lobby-board.<your-subdomain>.workers.dev
# (workers_dev stays enabled by default). Self-check after deploy:
#   curl -s https://sp-lobby-board.<your-subdomain>.workers.dev/api/health
#   => {"ok":true,"now":...}
#
# A custom domain / route can be added later — suggested (keep the /api/* path the lobby client uses):
#   [routes]
#   pattern = "lobby.example.com/api/*"
#   zone_name = "example.com"
#   # or a custom domain instead of a route:
#   # [[routes]]
#   # pattern = "lobby.example.com"
#   # custom_domain = true
# Then set the lobby client constant `BOARD` (tools/apk/extras/public/js/lobby.js) to the deployed
# origin, e.g. "https://sp-lobby-board.<your-subdomain>.workers.dev" — its host joins ALLOWED_HOSTS.
# ---------------------------------------------------------------------------------------------------
